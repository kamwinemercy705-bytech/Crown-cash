<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Crown Cash Administration</title>

    <meta
        name="description"
        content="Crown Cash Administration Dashboard">

    <meta name="theme-color" content="#110711">

    <link rel="stylesheet" href="admin.css">

    <style>

        /* =========================================================
           CROWN CASH ADMIN DASHBOARD
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 10% 0%,
                    rgba(255, 62, 180, 0.11),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(255, 193, 7, 0.07),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(125, 29, 105, 0.13),
                    transparent 35%
                ),
                #100710;

            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        /* =========================================================
           PAGE LOADER
           ========================================================= */

        #pageLoader {
            display: none !important;
        }

        /* =========================================================
           MAIN ADMIN APP
           ========================================================= */

        .admin-layout {
            min-height: 100vh;
            width: 100%;
        }

        .main-content {
            width: 100%;
            min-height: 100vh;

            padding: 34px 34px 50px;

            position: relative;
        }

        /* =========================================================
           DESKTOP SIDEBAR
           ========================================================= */

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            width: 250px;

            padding: 24px 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(39, 13, 38, 0.98),
                    rgba(18, 7, 18, 0.98)
                );

            border-right:
                1px solid rgba(255, 255, 255, 0.07);

            z-index: 1000;

            overflow-y: auto;
        }

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 32px;
        }

        .admin-logo {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 193, 7, 0.20),
                    rgba(255, 55, 175, 0.16)
                );

            border:
                1px solid rgba(255, 193, 7, 0.22);

            box-shadow:
                0 0 20px rgba(255, 193, 7, 0.06);
        }

        .logo-mark svg {
            width: 23px;
            height: 23px;

            fill: none;
            stroke: #ffd24d;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text strong {
            font-size: 14px;
            color: #ffffff;
        }

        .logo-text span {
            font-size: 10px;
            color: #d14bb0;
            margin-top: 2px;
        }

        .sidebar-close {
            display: none;

            border: 0;
            background: transparent;
            color: #ffffff;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-section-title {
            padding: 0 10px 8px;

            font-size: 10px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1.5px;

            color: rgba(255,255,255,0.40);
        }

        .nav-link {
            min-height: 44px;

            display: flex;
            align-items: center;
            gap: 11px;

            padding: 9px 11px;

            border-radius: 12px;

            color: rgba(255,255,255,0.68);

            font-size: 13px;
            font-weight: 600;

            transition: 0.25s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #ffffff;

            background:
                linear-gradient(
                    90deg,
                    rgba(255, 61, 178, 0.15),
                    rgba(255, 193, 7, 0.06)
                );

            border:
                1px solid rgba(255, 65, 183, 0.16);
        }

        .nav-icon {
            width: 31px;
            height: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.035);
        }

        .nav-icon svg {
            width: 18px;
            height: 18px;

            fill: none;
            stroke: #e8c43d;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-badge {
            margin-left: auto;

            min-width: 22px;
            height: 22px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 6px;

            border-radius: 20px;

            font-size: 10px;
            font-weight: 800;

            color: #ffffff;

            background:
                rgba(255, 54, 168, 0.20);

            border:
                1px solid rgba(255, 54, 168, 0.22);
        }

        .sidebar-footer {
            margin-top: 35px;
            padding-top: 20px;

            border-top:
                1px solid rgba(255,255,255,0.06);
        }

        .admin-profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-avatar-small {
            width: 37px;
            height: 37px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ffd24d;
            font-weight: 800;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 193, 7, 0.17),
                    rgba(255, 53, 177, 0.13)
                );

            border:
                1px solid rgba(255,193,7,0.17);
        }

        .admin-profile-info {
            min-width: 0;

            display: flex;
            flex-direction: column;
        }

        .admin-profile-info strong {
            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-profile-info span {
            font-size: 10px;
            color: rgba(255,255,255,0.45);

            margin-top: 2px;
        }

        .logout-button {
            width: 100%;

            margin-top: 16px;

            min-height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border-radius: 11px;

            border:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(255,255,255,0.025);

            color: rgba(255,255,255,0.65);

            cursor: pointer;
        }

        .logout-button svg {
            width: 17px;
            height: 17px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
        }

        .sidebar-overlay {
            display: none;
        }

        /* =========================================================
           MOBILE MENU
           ========================================================= */

        .mobile-header {
            display: none;
        }

        /* =========================================================
           TOP AREA
           ========================================================= */

        .dashboard-top {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 26px;
        }

        .top-label {
            display: inline-block;

            margin-bottom: 7px;

            color: #ed4ac1;

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .top-title {
            font-size: 30px;
            line-height: 1.15;
            font-weight: 800;

            color: #ffffff;
        }

        .top-title span {
            color: #ffd348;
        }

        /* =========================================================
           WELCOME CARD
           ========================================================= */

        .welcome-card {
            width: 100%;
            max-width: 1200px;

            margin: 0 auto;

            padding: 30px 34px;

            border-radius: 31px;

            background:
                radial-gradient(
                    circle at 92% 10%,
                    rgba(255, 65, 183, 0.15),
                    transparent 31%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(255, 193, 7, 0.07),
                    transparent 34%
                ),
                linear-gradient(
                    145deg,
                    rgba(51, 19, 49, 0.90),
                    rgba(22, 12, 24, 0.92)
                );

            border:
                1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 24px 70px rgba(0,0,0,0.25),
                inset 0 1px 0 rgba(255,255,255,0.03);

            position: relative;
            overflow: hidden;
        }

        .welcome-card::after {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            right: -120px;
            top: -140px;

            border-radius: 50%;

            background:
                rgba(255, 69, 190, 0.08);

            filter: blur(10px);

            pointer-events: none;
        }

        .welcome-eyebrow {
            display: block;

            margin-bottom: 14px;

            color: #ef4dc5;

            font-size: 13px;
            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .welcome-title {
            position: relative;
            z-index: 2;

            font-size: clamp(30px, 4vw, 48px);
            line-height: 1.12;

            font-weight: 850;

            letter-spacing: -1.3px;

            color: #ffffff;
        }

        .welcome-title span {
            color: #ffd348;
        }

        .welcome-description {
            max-width: 770px;

            margin-top: 17px;

            color: rgba(255,255,255,0.62);

            font-size: 15px;
            line-height: 1.8;
        }

        .welcome-actions {
            display: flex;

            gap: 13px;

            margin-top: 26px;

            position: relative;
            z-index: 2;
        }

        .primary-action,
        .secondary-action {
            min-height: 52px;

            padding: 0 28px;

            border-radius: 16px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 11px;

            font-size: 14px;
            font-weight: 800;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;
        }

        .primary-action {
            color: #170812;

            background:
                linear-gradient(
                    110deg,
                    #ffd04c 0%,
                    #ffb15a 40%,
                    #ff43b4 100%
                );

            box-shadow:
                0 12px 30px rgba(255, 66, 177, 0.16);
        }

        .secondary-action {
            color: #ffffff;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255, 67, 184, 0.30);
        }

        .primary-action:hover,
        .secondary-action:hover {
            transform: translateY(-2px);
        }

        .primary-action svg,
        .secondary-action svg {
            width: 23px;
            height: 23px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================================
           PLATFORM OVERVIEW
           ========================================================= */

        .overview-section {
            width: 100%;
            max-width: 1200px;

            margin: 42px auto 0;
        }

        .section-label {
            display: block;

            margin-bottom: 10px;

            color: #ed4ac1;

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .section-title {
            font-size: 29px;
            line-height: 1.2;

            color: #ffffff;

            font-weight: 820;

            letter-spacing: -0.7px;
        }

        /* =========================================================
           STATS GRID
           ========================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-top: 24px;
        }

        .stat-card {
            min-height: 188px;

            padding: 23px;

            border-radius: 23px;

            background:
                radial-gradient(
                    circle at 100% 0%,
                    rgba(255, 60, 182, 0.07),
                    transparent 43%
                ),
                linear-gradient(
                    145deg,
                    rgba(39, 20, 42, 0.90),
                    rgba(23, 12, 26, 0.88)
                );

            border:
                1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.18);

            position: relative;

            overflow: hidden;
        }

        .stat-card::before {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            right: -55px;
            top: -55px;

            border-radius: 50%;

            background:
                rgba(255,193,7,0.04);
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-icon {
            width: 53px;
            height: 53px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,193,7,0.13),
                    rgba(255,59,177,0.10)
                );

            border:
                1px solid rgba(255,193,7,0.13);

            box-shadow:
                inset 0 0 20px rgba(255,193,7,0.03);
        }

        .stat-icon svg {
            width: 26px;
            height: 26px;

            fill: none;

            stroke: #ffd343;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stat-label {
            display: block;

            margin-top: 22px;

            color: rgba(255,255,255,0.56);

            font-size: 13px;
            font-weight: 700;
        }

        .stat-value {
            margin-top: 6px;

            color: #ffffff;

            font-size: 27px;
            line-height: 1.15;

            font-weight: 850;

            letter-spacing: -0.5px;
        }

        .stat-value.currency {
            font-size: 24px;
        }

        .stat-footer {
            margin-top: 9px;

            color: rgba(255,255,255,0.30);

            font-size: 10px;
        }

        /* =========================================================
           PENDING ACTIONS
           ========================================================= */

        .pending-section {
            width: 100%;
            max-width: 1200px;

            margin: 38px auto 0;
        }

        .pending-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 15px;

            margin-top: 20px;
        }

        .pending-card {
            min-height: 92px;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 17px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(42, 20, 44, 0.85),
                    rgba(21, 11, 25, 0.88)
                );

            border:
                1px solid rgba(255,255,255,0.07);

            transition: 0.22s ease;
        }

        .pending-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(255, 64, 183, 0.20);
        }

        .pending-icon {
            width: 45px;
            height: 45px;

            flex: 0 0 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                rgba(255,193,7,0.08);

            border:
                1px solid rgba(255,193,7,0.13);
        }

        .pending-icon svg {
            width: 22px;
            height: 22px;

            fill: none;

            stroke: #ffd343;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pending-info {
            min-width: 0;

            display: flex;
            flex-direction: column;

            gap: 4px;
        }

        .pending-info span {
            color: rgba(255,255,255,0.48);

            font-size: 11px;
            font-weight: 650;
        }

        .pending-info strong {
            color: #ffffff;

            font-size: 17px;
            font-weight: 800;
        }

        /* =========================================================
           LOWER DASHBOARD
           ========================================================= */

        .lower-grid {
            width: 100%;
            max-width: 1200px;

            margin: 34px auto 0;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .dashboard-card {
            padding: 23px;

            min-height: 300px;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(39,20,42,0.86),
                    rgba(21,11,24,0.90)
                );

            border:
                1px solid rgba(255,255,255,0.07);
        }

        .card-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;

            padding-bottom: 18px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);
        }

        .card-heading h3 {
            color: #ffffff;

            font-size: 18px;
            font-weight: 800;
        }

        .card-heading span {
            display: block;

            margin-bottom: 6px;

            color: #ed4ac1;

            font-size: 10px;
            font-weight: 850;

            letter-spacing: 1.3px;

            text-transform: uppercase;
        }

        .view-all {
            color: #ffd343;

            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
        }

        .recent-list {
            padding-top: 7px;
        }

        .empty-state {
            min-height: 200px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: rgba(255,255,255,0.35);
        }

        .empty-state p {
            margin-top: 12px;

            font-size: 12px;
        }

        .empty-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                rgba(255,193,7,0.06);

            border:
                1px solid rgba(255,193,7,0.08);
        }

        .empty-icon svg {
            width: 22px;
            height: 22px;

            fill: none;

            stroke: #dcb93d;

            stroke-width: 1.6;
        }

        /* =========================================================
           MAINTENANCE SECTION
           ========================================================= */

        .maintenance-section {
            width: 100%;
            max-width: 1200px;

            margin: 42px auto 0;
        }

        .maintenance-card {
            margin-top: 22px;

            padding: 25px;

            border-radius: 23px;

            background:
                linear-gradient(
                    145deg,
                    rgba(39,20,42,0.92),
                    rgba(21,11,24,0.94)
                );

            border:
                1px solid rgba(255,255,255,0.08);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.18);
        }

        .maintenance-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            padding-bottom: 20px;

            border-bottom:
                1px solid rgba(255,255,255,0.06);
        }

        .maintenance-eyebrow {
            display: block;

            margin-bottom: 7px;

            color: #ed4ac1;

            font-size: 10px;
            font-weight: 850;

            letter-spacing: 1.5px;

            text-transform: uppercase;
        }

        .maintenance-header h3 {
            color: #ffffff;

            font-size: 20px;
            font-weight: 800;
        }

        .maintenance-header p {
            max-width: 650px;

            margin-top: 7px;

            color: rgba(255,255,255,0.43);

            font-size: 12px;
            line-height: 1.6;
        }

        .maintenance-status {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            padding: 9px 13px;

            border-radius: 30px;

            background:
                rgba(72,210,125,0.08);

            border:
                1px solid rgba(72,210,125,0.14);

            white-space: nowrap;
        }

        .maintenance-status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #50d58a;

            box-shadow:
                0 0 10px rgba(80,213,138,0.5);
        }

        .maintenance-status strong {
            color: #72dda0;

            font-size: 11px;
        }

        .maintenance-master {
            margin-top: 20px;

            padding: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            border-radius: 17px;

            background:
                rgba(255,193,7,0.045);

            border:
                1px solid rgba(255,193,7,0.11);
        }

        .maintenance-control-info {
            min-width: 0;

            display: flex;
            flex-direction: column;

            gap: 5px;
        }

        .maintenance-control-info strong {
            color: #ffffff;

            font-size: 13px;
            font-weight: 800;
        }

        .maintenance-control-info span {
            color: rgba(255,255,255,0.42);

            font-size: 10px;
            line-height: 1.5;
        }

        .maintenance-controls {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 14px;
        }

        .maintenance-control {
            min-height: 78px;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 14px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.025);

            border:
                1px solid rgba(255,255,255,0.06);
        }

        .maintenance-control-icon {
            width: 40px;
            height: 40px;

            flex: 0 0 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                rgba(255,193,7,0.07);

            font-size: 17px;
        }

        .maintenance-control .maintenance-control-info {
            flex: 1;
        }

        .maintenance-switch {
            position: relative;

            display: inline-block;

            width: 46px;
            height: 25px;

            flex: 0 0 auto;
        }

        .maintenance-switch input {
            width: 0;
            height: 0;

            opacity: 0;
        }

        .maintenance-slider {
            position: absolute;

            inset: 0;

            cursor: pointer;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid rgba(255,255,255,0.08);

            transition: 0.25s ease;
        }

        .maintenance-slider::before {
            content: "";

            position: absolute;

            width: 17px;
            height: 17px;

            left: 3px;
            top: 3px;

            border-radius: 50%;

            background: #ffffff;

            transition: 0.25s ease;

            box-shadow:
