<div class="form-section"><div class="section-title">
    <i class="fas fa-user-circle"></i>
    <div>
        <h3>Personal Information</h3>
        <p>Enter your details to create your Crown Cash account.</p>
    </div>
</div>

<!-- First Name + Last Name -->
<div class="form-row">

    <div class="form-group">
        <label for="first_name">
            <i class="fas fa-user"></i>
            First Name
        </label>

        <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>

            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter your first name"
                autocomplete="given-name"
                required
            >
        </div>
    </div>

    <div class="form-group">
        <label for="last_name">
            <i class="fas fa-user"></i>
            Last Name
        </label>

        <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>

            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter your last name"
                autocomplete="family-name"
                required
            >
        </div>
    </div>

</div>

<!-- Phone -->
<div class="form-group">
    <label for="phone">
        <i class="fas fa-phone"></i>
        Phone Number
    </label>

    <div class="input-wrapper">
        <i class="fas fa-phone input-icon"></i>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 0771234567"
            autocomplete="tel"
            inputmode="tel"
            required
        >
    </div>

    <small class="input-help">
        <i class="fas fa-mobile-alt"></i>
        Use your active Ugandan mobile number.
    </small>
</div>

<!-- Email -->
<div class="form-group">
    <label for="email">
        <i class="fas fa-envelope"></i>
        Email Address
    </label>

    <div class="input-wrapper">
        <i class="fas fa-envelope input-icon"></i>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
        >
    </div>
</div>

<!-- Password -->
<div class="form-group">
    <label for="password">
        <i class="fas fa-lock"></i>
        Password
    </label>

    <div class="input-wrapper password-wrapper">
        <i class="fas fa-lock input-icon"></i>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a strong password"
            autocomplete="new-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-target="password"
            aria-label="Show password"
        >
            <i class="fas fa-eye"></i>
        </button>
    </div>

    <small class="input-help">
        <i class="fas fa-shield-alt"></i>
        Use at least 8 characters.
    </small>
</div>

<!-- Confirm Password -->
<div class="form-group">
    <label for="confirm_password">
        <i class="fas fa-lock"></i>
        Confirm Password
    </label>

    <div class="input-wrapper password-wrapper">
        <i class="fas fa-lock input-icon"></i>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            required
        >

        <button
            type="button"
            class="password-toggle"
            data-target="confirm_password"
            aria-label="Show password"
        >
            <i class="fas fa-eye"></i>
        </button>
    </div>
</div>

<!-- Referral Code -->
<div class="form-group">
    <label for="referral_code">
        <i class="fas fa-gift"></i>
        Referral Code
        <span class="optional-label">Optional</span>
    </label>

    <div class="input-wrapper">
        <i class="fas fa-gift input-icon"></i>

        <input
            type="text"
            id="referral_code"
            name="referral_code"
            placeholder="Enter referral code"
            autocomplete="off"
        >
    </div>

    <small class="input-help">
        <i class="fas fa-users"></i>
        Enter a referral code if someone invited you.
    </small>
</div>

</div><!-- Terms --><div class="terms-box"><label class="checkbox-container">

    <input
        type="checkbox"
        id="terms"
        name="terms"
        required
    >

    <span class="custom-checkbox">
        <i class="fas fa-check"></i>
    </span>

    <span class="terms-text">
        I agree to the
        <a href="terms.html">Terms & Conditions</a>
        and
        <a href="privacy.html">Privacy Policy</a>.
    </span>

</label>

</div><!-- Form Message --><div
    id="formMessage"
    class="form-message"
    role="alert"
    aria-live="polite"
></div><!-- Create Account Button --><button
type="submit"
class="register-btn"
id="registerBtn"

    <i class="fas fa-user-plus"></i>

</span>

<i class="fas fa-arrow-right"></i>
