<form action="php/withdrawal.php" method="POST">

    <label>Amount (UGX)</label>

    <input
        type="number"
        name="amount"
        min="1"
        required
    >

    <label>Payment Method</label>

    <select name="method" required>

        <option value="">
            Select method
        </option>

        <option value="MTN">
            MTN Mobile Money
        </option>

        <option value="Airtel">
            Airtel Money
        </option>

    </select>

    <label>Mobile Money Number</label>

    <input
        type="text"
        name="account"
        required
    >

    <button type="submit">
        Request Withdrawal
    </button>

</form>
